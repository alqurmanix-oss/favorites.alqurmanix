<!doctype html>
<html lang="ar" dir="rtl">
<head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>AQX Favorites</title><style>
*{box-sizing:border-box}body{margin:0;width:330px;background:#f8f7fc;color:#28233d;font:14px Tahoma,Arial,sans-serif}.wrap{padding:18px}.head{display:flex;align-items:center;gap:11px;margin-bottom:16px}.logo{width:42px;height:42px;border-radius:14px;background:linear-gradient(135deg,#6d4bd1,#a28df1);display:grid;place-items:center;color:#fff;font-size:24px}.head strong{font-size:16px}.head small{display:block;color:#89839c;font-size:10px;margin-top:4px}.panel{background:#fff;border:1px solid #eeeaf6;border-radius:16px;padding:15px;margin-bottom:12px}.status{display:flex;justify-content:space-between;align-items:center;font-size:12px;color:#68627a}.dot{display:inline-block;width:8px;height:8px;border-radius:50%;background:#21a276;margin-left:6px}.metric{color:#6d4bd1;font-weight:800}.button{width:100%;border:0;border-radius:11px;padding:12px;background:#6d4bd1;color:#fff;font-weight:700;cursor:pointer;margin-top:10px}.button.secondary{background:#f1edfc;color:#6347bd}.button:disabled{opacity:.5;cursor:wait}.muted{color:#8b859c;font-size:11px;line-height:1.8}.message{font-size:11px;line-height:1.8;margin-top:10px;color:#625d75;min-height:20px}.field{width:100%;border:1px solid #e9e4f2;border-radius:10px;padding:11px;margin-top:8px;font:12px Tahoma}.links{display:flex;justify-content:space-between;margin-top:13px;font-size:11px}.links a{color:#6d4bd1;text-decoration:none}
</style></head><body><div class="wrap">
