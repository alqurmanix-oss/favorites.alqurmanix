<!doctype html><html lang="ar" dir="rtl"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>AQX Device Identity</title><style>body{font:15px Tahoma,Arial;background:#f7f5fc;color:#29233c;min-height:100vh;display:grid;place-items:center;margin:0;padding:18px}main{width:min(460px,100%);background:white;border:1px solid #ebe6f5;border-radius:20px;padding:26px;box-shadow:0 18px 55px #30204d12}h1{text-align:center;font-size:21px}p{line-height:1.9;color:#777187;text-align:center;font-size:13px}button{width:100%;padding:14px;border:0;border-radius:12px;background:#6d4bd1;color:white;font-weight:800;font:inherit;cursor:pointer;margin-top:12px}button:disabled{opacity:.6}#status{min-height:36px;text-align:center;color:#6d4bd1;font-size:12px;line-height:1.8;margin-top:14px}</style><main><h1>هوية جهاز AQX</h1><p>اعتماد تشفيري يساعد AQX على التعرف على مكتبة الضيف دون كتابة مفتاح الاسترداد. قد يتطلب النظام موافقة أو تحققًا من الجهاز، ولا يعمل على جميع المتصفحات.</p><button id="run">تفعيل هوية الجهاز</button><div id="status" role="status" aria-live="polite"></div></main><script>
(()=>{'use strict';
const API='https://vuszqzgldbsscuxdfhdz.supabase.co/functions/v1/aqx-device-identity';
const TOKEN='aqx_favorites_guest_token_v1',REC='aqx_favorites_recovery_key_set_v1',TRUST='aqx_favorites_device_trusted_v1',RID='aqx_favorites_device_record_id_v1',IDENTITY='aqx_favorites_device_identity_v1',SESSION='aqx_favorites_device_session_only_v1',SYNC='aqx_favorites_sync_code_v1';
const $=id=>document.getElementById(id),params=new URLSearchParams(location.search),mode=params.get('mode')==='register'?'register':'authenticate';
function dec(v){const s=String(v||'').replace(/-/g,'+').replace(/_/g,'/');return Uint8Array.from(atob(s+'='.repeat((4-s.length%4)%4)),c=>c.charCodeAt(0))}
function enc(v){return btoa(String.fromCharCode(...new Uint8Array(v))).replace(/\\+/g,'-').replace(/\\//g,'_').replace(/=+$/g,'')}
function options(o){const p={...o,challenge:dec(o.challenge)};if(o.user)p.user={...o.user,id:dec(o.user.id)};for(const k of ['excludeCredentials','allowCredentials'])if(o[k])p[k]=o[k].map(x=>({...x,id:dec(x.id)}));return p}
function serialize(c,registration){const r=c.response,x={id:c.id,rawId:enc(c.rawId),type:c.type,clientExtensionResults:c.getClientExtensionResults?.()||{}};x.response=registration?{attestationObject:enc(r.attestationObject),clientDataJSON:enc(r.clientDataJSON),transports:r.getTransports?.()||[]}:{authenticatorData:enc(r.authenticatorData),clientDataJSON:enc(r.clientDataJSON),signature:enc(r.signature),userHandle:r.userHandle?enc(r.userHandle):null};return x}
async function call(path,body,token){const r=await fetch(API+path,{method:'POST',headers:{'Content-Type':'application/json',...(token?{'x-aqx-guest-token':token}:{})},body:JSON.stringify(body||{}),cache:'no-store'});const b=await r.json().catch(()=>({}));if(!r.ok)throw Error(b.error||'تعذر إكمال العملية');return b}
async function run(){const b=$('run');b.disabled=true;$('status').textContent='جارٍ التحقق…';try{if(!window.PublicKeyCredential||!navigator.credentials)throw Error('المتصفح لا يدعم WebAuthn.');
let result;
if(mode==='register'){const token=localStorage.getItem(TOKEN)||'';if(token.length<32)throw Error('افتح مكتبتك أولًا ثم فعّل هوية الجهاز.');const start=await call('/register/options',{},token);const c=await navigator.credentials.create({publicKey:options(start.options)});if(!c)throw Error('لم يكتمل إنشاء الاعتماد.');result=await call('/register/verify',{challenge_id:start.challenge_id,response:serialize(c,true)},token)}
else{const start=await call('/authenticate/options',{});const c=await navigator.credentials.get({publicKey:options(start.options)});if(!c)throw Error('لم يتم اختيار اعتماد.');result=await call('/authenticate/verify',{challenge_id:start.challenge_id,response:serialize(c,false)})}
if(result.device_token){localStorage.setItem(TOKEN,result.device_token);localStorage.setItem(RID,result.device?.id||'')}localStorage.setItem(REC,'1');localStorage.setItem(TRUST,'1');localStorage.setItem(IDENTITY,'1');localStorage.removeItem(SYNC);sessionStorage.removeItem(SESSION);$('status').textContent='تم التحقق من اعتماد الجهاز بنجاح. جارٍ فتح مكتبتك…';const back=params.get('return')||'/guest/index.html';setTimeout(()=>location.replace(back),350)
}catch(e){$('status').textContent=e.message||'تعذر التعرف على الجهاز.';b.disabled=false}}
$('run').addEventListener('click',run);
})();
</script></html>
