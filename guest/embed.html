<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="referrer" content="no-referrer"><title>AQX Favorites Embed</title>
<style>
:root{font-family:Tahoma,Arial,sans-serif;color:#29233c}*{box-sizing:border-box}
html,body{margin:0;width:100%;height:100%;background:transparent;overflow:hidden}
button{font:inherit;cursor:pointer}
#save{height:48px;min-width:142px;padding:0 17px;border:0;border-radius:13px;background:linear-gradient(135deg,#6d4bd1,#9277e6);color:#fff;font-weight:800;font-size:13px;box-shadow:0 5px 18px #34205b22;white-space:nowrap}
#save:disabled{opacity:.7;cursor:wait}
.heart{display:inline-block;margin-inline-start:6px;font-size:17px;vertical-align:-1px}
.fly{position:fixed;pointer-events:none;z-index:9;animation:fly .85s ease-out forwards}
@keyframes fly{0%{opacity:1;transform:translateY(0) scale(.8)}100%{opacity:0;transform:translateY(-72px) scale(1.8)}}
#status{font:11px Tahoma,Arial,sans-serif;color:#6d4bd1;margin-top:4px;min-height:14px}
#float{position:fixed;left:5px;top:50%;transform:translateY(-50%);width:48px;height:48px;border:0;border-radius:50%;background:linear-gradient(135deg,#6d4bd1,#9277e6);color:#fff;font-size:25px;box-shadow:0 5px 18px #34205b55}
#panel{display:none;position:fixed;left:58px;top:50%;transform:translateY(-50%);width:310px;max-width:calc(100vw - 65px);height:min(490px,calc(100vh - 24px));background:#fff;border:1px solid #e9e3f5;border-radius:18px;box-shadow:0 12px 40px #24174435;overflow:hidden}
#panel.open{display:flex;flex-direction:column}
.head{padding:15px 16px;background:#faf8ff;border-bottom:1px solid #eee9f6;display:flex;justify-content:space-between;align-items:center}
.head strong{font-size:14px}.head button{border:0;background:transparent;color:#6d4bd1;font-size:22px}
#items{padding:10px 12px;overflow:auto;flex:1}
.item{display:flex;align-items:center;gap:10px;padding:11px 8px;border-bottom:1px solid #f0edf5;color:#29233c;min-width:0}
.thumb{width:54px;height:54px;flex:none;border-radius:11px;object-fit:cover;background:#f2effb;border:1px solid #eee9f6}
.thumb.fallback{object-fit:contain;padding:13px}
.item-body{min-width:0;flex:1}
.item b{display:block;font-size:12px;line-height:1.6;white-space:normal;overflow-wrap:anywhere}.item small{display:block;color:#8a8498;font-size:10px;direction:ltr;text-align:left;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;margin-top:4px}
.item .read{display:inline-block;margin-top:7px;color:#6d4bd1;font-size:10px;font-weight:800;text-decoration:none}
.empty,.msg{padding:18px 10px;color:#817b90;font-size:12px;line-height:1.8;text-align:center}
.foot{padding:10px 14px;border-top:1px solid #eee9f6;text-align:center}.foot a{color:#6d4bd1;text-decoration:none;font-weight:800;font-size:12px}
</style>
</head>
<body>
<div id="saveWrap" hidden><button id="save" type="button">احفظ الصفحة <span class="heart">♡</span></button><div id="status" role="status"></div></div>
<div id="recentWrap" hidden><button id="float" type="button" aria-label="آخر محفوظاتي" title="آخر محفوظاتي">♡</button><section id="panel"><div class="head"><strong>آخر خمسة محفوظات</strong><a href="https://favorites.alqurmanix.com/guest/index.html" target="_blank" rel="noopener" style="font-size:11px;color:#6d4bd1;font-weight:800">مكتبتي</a></div><div id="items"><div class="empty">اضغط لعرض محفوظاتك.</div></div><div class="foot"><a href="https://favorites.alqurmanix.com/guest/index.html" target="_blank" rel="noopener">فتح مكتبتي بالكامل ←</a></div></section></div>
<script>
(()=>{
'use strict';
const API='https://vuszqzgldbsscuxdfhdz.supabase.co/functions/v1/aqx-favorites';
const TOKEN_KEY='aqx_favorites_guest_token_v1';
const p=new URLSearchParams(location.search),mode=p.get('mode');
const $=id=>document.getElementById(id);
const resize=(open)=>parent.postMessage({type:'aqx-favorites-embed-resize',open},'*');
let tokenPromise=null,guestStorage=null,storageAccessPromise=null;
async function requestGuestStorageAccess(){
  if(guestStorage)return guestStorage;
  if(storageAccessPromise)return storageAccessPromise;
  storageAccessPromise=(async()=>{
    if(typeof document.requestStorageAccess!=='function')
      throw new Error('هذا المتصفح لا يدعم منح AQX وصولًا موحدًا للتخزين بين المواقع.');
    // Must be called directly from the visitor's click/tap. The browser owns
    // the permission UI; AQX never simulates or silently grants this permission.
    const handle=await document.requestStorageAccess({localStorage:true});
    if(!handle||!handle.localStorage)
      throw new Error('المتصفح لم يمنح وصول التخزين المشترك المطلوب.');
    guestStorage=handle.localStorage;
    return guestStorage;
  })();
  try{return await storageAccessPromise}finally{storageAccessPromise=null}
}
async function unlock(){
  if(tokenPromise)return tokenPromise;
  tokenPromise=(async()=>{
    const storage=await requestGuestStorageAccess();
    let saved='';
    try{saved=storage.getItem(TOKEN_KEY)||''}
    catch{throw new Error('تعذر الوصول إلى مكتبة Guest المشتركة.')}
    if(saved.length>=8)return saved;
    throw new Error('لا توجد مكتبة مفعّلة على هذا المتصفح. افتح مكتبتك أو أنشئ مكتبة من AQX Favorites أولاً.');
  })();
  try{return await tokenPromise}finally{tokenPromise=null}
}
async function api(path,token,options={}){
 const r=await fetch(API+path,{...options,headers:{'Content-Type':'application/json','x-aqx-guest-token':token,...(options.headers||{})},cache:'no-store'});
 const b=await r.json().catch(()=>({}));
 if(!r.ok)throw new Error(b.error||'تعذر الاتصال بالمكتبة');
 return b;
}
function heart(){
 const el=document.createElement('span');el.className='fly';el.textContent='♥';
 const r=$('save').getBoundingClientRect();el.style.left=(r.left+r.width/2)+'px';el.style.top=r.top+'px';$('saveWrap').appendChild(el);setTimeout(()=>el.remove(),900);
}
function save(){
 const url=p.get('url')||'';
 if(!url){$('status').textContent='رابط الصفحة غير صالح';return}
 const target=new URL('/guest/save.html',location.origin);
 target.searchParams.set('url',url);
 target.searchParams.set('title',p.get('title')||'');
 const popup=window.open(target.href,'aqxFavoritesSave','popup=yes,width=420,height=280,resizable=yes,scrollbars=no');
 const status=$('status');
 status.replaceChildren();
 if(!popup){
  status.textContent='المتصفح حظر النافذة المنبثقة. ';
  const link=document.createElement('a');
  link.href=target.href;link.target='_blank';link.rel='noopener';
  link.textContent='افتح صفحة الحفظ مباشرة';
  link.style.cssText='color:#6d4bd1;font-weight:800;text-decoration:underline';
  status.appendChild(link);
  return;
 }
 status.textContent='تم فتح نافذة AQX لإتمام الحفظ…';
}
function safeText(s){return String(s||'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}
async function loadRecent(){
 const box=$('items');box.innerHTML='<div class="msg">جارٍ تحميل المحفوظات…</div>';
 try{
  const token=await unlock(),all=[];
  for(let offset=0;offset<5000;offset+=100){
   const r=await api('/items?limit=100&offset='+offset,token);
   all.push(...(r.items||[]));if((r.items||[]).length<100)break;
  }
  all.sort((a,b)=>new Date(b.created_at||0)-new Date(a.created_at||0));
  const latest=all.slice(0,5);
  box.replaceChildren();
  if(!latest.length){box.innerHTML='<div class="empty">لا توجد محفوظات حتى الآن.</div>';return}
  latest.forEach(x=>{
   const card=document.createElement('div');card.className='item';
   const thumb=document.createElement('img');thumb.className='thumb';thumb.alt='';thumb.referrerPolicy='no-referrer';thumb.loading='lazy';
   let imageUrl='';
   try{imageUrl=x.metadata?.og_image||x.metadata?.image||x.metadata?.thumbnail||new URL('/favicon.ico',new URL(x.url).origin).href}catch{}
   if(imageUrl)thumb.src=imageUrl;
   thumb.onerror=()=>{thumb.removeAttribute('src');thumb.classList.add('fallback');thumb.alt='♡'};
   const body=document.createElement('div');body.className='item-body';
   const b=document.createElement('b');b.textContent=x.title||x.url;
   const sm=document.createElement('small');sm.textContent=x.url;
   const read=document.createElement('a');read.className='read';read.href=x.url;read.target='_blank';read.rel='noopener noreferrer';read.textContent='أكمل القراءة ←';
   body.append(b,sm,read);card.append(thumb,body);box.appendChild(card);
  });
 }catch(e){box.replaceChildren();const msg=document.createElement('div');msg.className='msg';msg.textContent=e.message||'تعذر تحميل المحفوظات';const link=document.createElement('a');link.href='https://favorites.alqurmanix.com/guest/index.html';link.textContent='فتح مكتبتي أو إنشاء مكتبة جديدة';link.style.cssText='display:block;margin:10px auto;color:#6d4bd1;font-weight:800;text-decoration:underline;text-align:center';box.append(msg,link)}
}
if(mode==='save'){
 $('saveWrap').hidden=false;
 const u=p.get('url')||'';
 try{new URL(u)}catch{$('save').disabled=true;$('status').textContent='رابط الصفحة غير صالح'}
 $('save').addEventListener('click',save);
}else if(mode==='recent'){
 $('recentWrap').hidden=false;
 $('float').addEventListener('click',async()=>{const opening=!$('panel').classList.contains('open');$('panel').classList.toggle('open',opening);resize(opening);if(opening)await loadRecent()});
}else{document.body.textContent='Invalid embed mode'}
})();
</script>
</body></html>
