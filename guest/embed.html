<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="referrer" content="no-referrer"><title>AQX Favorites Embed</title>
<style>
:root{font-family:Tahoma,Arial,sans-serif;color:#29233c}*{box-sizing:border-box}
html,body{margin:0;width:100%;height:100%;background:transparent;overflow:hidden}
button{font:inherit;cursor:pointer}
#save{height:48px;min-width:142px;padding:0 17px;border:0;border-radius:13px;background:linear-gradient(135deg,#6d4bd1,#9277e6);color:#fff;font-weight:800;font-size:13px;box-shadow:0 5px 18px #34205b22;white-space:nowrap}
#save:disabled{opacity:.7;cursor:wait}
.heart{display:inline-block;margin-inline-start:6px;font-size:17px;vertical-align:-1px}
.fly{position:fixed;pointer-events:none;z-index:9;animation:fly .85s ease-out forwards}
@keyframes fly{0%{opacity:1;transform:translateY(0) scale(.8)}100%{opacity:0;transform:translateY(-72px) scale(1.8)}}
#status{font:11px Tahoma,Arial,sans-serif;color:#6d4bd1;margin-top:4px;min-height:14px}
#float{position:fixed;left:6px;top:16px;transform:none;width:48px;height:48px;border:0;border-radius:50%;background:linear-gradient(135deg,#6d4bd1,#9277e6);color:#fff;font-size:25px;box-shadow:0 5px 18px #34205b55}
#recentBackdrop{display:none;position:fixed;inset:0;background:rgba(24,18,42,.48);z-index:10}
#recentBackdrop.open{display:block}
#panel{display:none;position:fixed;left:50%;top:50%;transform:translate(-50%,-50%);width:min(340px,calc(100vw - 20px));height:min(740px,calc(100dvh - 20px));background:#fff;border:1px solid #e9e3f5;border-radius:18px;box-shadow:0 12px 40px #24174455;overflow:hidden;z-index:11}
#panel.open{display:flex;flex-direction:column}
#items{padding:8px 10px;overflow:auto;flex:1;min-height:0}
#ad-block{display:flex;justify-content:center;align-items:center;width:300px;height:250px;max-width:100%;margin:10px auto;padding:0;border-bottom:1px solid #f0edf5;overflow:hidden}
.head{gap:10px}.head .brand-link{color:#6d4bd1;text-decoration:none;font-weight:900}
.head .head-actions{display:flex;align-items:center;gap:9px}.head .close-panel{border:0;background:#f2effb;color:#6d4bd1;border-radius:9px;width:30px;height:30px;font-size:20px;line-height:1}
.head{padding:15px 16px;background:#faf8ff;border-bottom:1px solid #eee9f6;display:flex;justify-content:space-between;align-items:center}
.head strong{font-size:14px}.head button{border:0;background:transparent;color:#6d4bd1;font-size:22px}
#items{padding:10px 12px;overflow:auto;flex:1}
.item{display:flex;align-items:center;gap:10px;padding:11px 8px;border-bottom:1px solid #f0edf5;color:#29233c;min-width:0}
.thumb{width:54px;height:54px;flex:none;border-radius:11px;object-fit:cover;background:#f2effb;border:1px solid #eee9f6}
.thumb.fallback{object-fit:contain;padding:13px}
.item-body{min-width:0;flex:1}
.item b{display:block;font-size:12px;line-height:1.6;white-space:normal;overflow-wrap:anywhere}.item small{display:block;color:#8a8498;font-size:10px;direction:ltr;text-align:left;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;margin-top:4px}
.item .read{display:inline-block;margin-top:7px;color:#6d4bd1;font-size:10px;font-weight:800;text-decoration:none}
.empty,.msg{padding:18px 10px;color:#817b90;font-size:12px;line-height:1.8;text-align:center}
.foot{padding:10px 14px;border-top:1px solid #eee9f6;text-align:center}.foot a{color:#6d4bd1;text-decoration:none;font-weight:800;font-size:12px}
</style>
</head>
<body>
<div id="saveWrap" hidden><button id="save" type="button">احفظ الصفحة <span class="heart">♡</span></button><div id="status" role="status"></div></div>
<div id="recentWrap" hidden><button id="float" type="button" aria-label="آخر محفوظاتي" title="آخر محفوظاتي">♡</button><div id="recentBackdrop"></div><div id="recentStatus" role="status"></div><section id="panel" role="dialog" aria-modal="true" aria-label="آخر محفوظاتي"><div class="head"><strong id="aqxBrand"><a class="brand-link" href="https://alqurmanix.com/" target="_blank" rel="noopener">AQX Favorites</a></strong><div class="head-actions"><a href="https://favorites.alqurmanix.com/guest/index.html" target="_blank" rel="noopener" style="font-size:11px;color:#6d4bd1;font-weight:800">مكتبتي</a><button class="close-panel" id="closePanel" type="button" aria-label="إغلاق">×</button></div></div><div id="items"><div class="empty">اضغط لعرض محفوظاتك.</div></div><div class="foot"><a href="https://favorites.alqurmanix.com/guest/index.html" target="_blank" rel="noopener">فتح مكتبتي بالكامل ←</a></div></section></div>
<script>
(()=>{
'use strict';
const API='https://vuszqzgldbsscuxdfhdz.supabase.co/functions/v1/aqx-favorites';
const TOKEN_KEY='aqx_favorites_guest_token_v1';
const p=new URLSearchParams(location.search),mode=p.get('mode');
const $=id=>document.getElementById(id);
const resize=(open)=>parent.postMessage({type:open?'aqx-favorites-open':'aqx-favorites-close'},'*');
let tokenPromise=null,guestStorage=null,storageAccessPromise=null;
async function requestGuestStorageAccess(){
  if(guestStorage)return guestStorage;
  if(storageAccessPromise)return storageAccessPromise;
  storageAccessPromise=(async()=>{
    if(typeof document.requestStorageAccess!=='function')
      throw new Error('هذا المتصفح لا يدعم منح AQX وصولًا موحدًا للتخزين بين المواقع.');
    // Must be called directly from the visitor's click/tap. The browser owns
    // the permission UI; AQX never simulates or silently grants this permission.
    const handle=await document.requestStorageAccess({localStorage:true});
    if(!handle||!handle.localStorage)
      throw new Error('المتصفح لم يمنح وصول التخزين المشترك المطلوب.');
    guestStorage=handle.localStorage;
    return guestStorage;
  })();
  try{return await storageAccessPromise}finally{storageAccessPromise=null}
}
async function unlock(){
  if(tokenPromise)return tokenPromise;
  tokenPromise=(async()=>{
    const storage=await requestGuestStorageAccess();
    let saved='';
    try{saved=storage.getItem(TOKEN_KEY)||''}
    catch{throw new Error('تعذر الوصول إلى مكتبة Guest المشتركة.')}
    if(saved.length>=8)return saved;
    throw new Error('لا توجد مكتبة مفعّلة على هذا المتصفح. افتح مكتبتك أو أنشئ مكتبة من AQX Favorites أولاً.');
  })();
  try{return await tokenPromise}finally{tokenPromise=null}
}
async function api(path,token,options={}){
 const r=await fetch(API+path,{...options,headers:{'Content-Type':'application/json','x-aqx-guest-token':token,...(options.headers||{})},cache:'no-store'});
 const b=await r.json().catch(()=>({}));
 if(!r.ok)throw new Error(b.error||'تعذر الاتصال بالمكتبة');
 return b;
}
function heart(){
 const el=document.createElement('span');el.className='fly';el.textContent='♥';
 const r=$('save').getBoundingClientRect();el.style.left=(r.left+r.width/2)+'px';el.style.top=r.top+'px';$('saveWrap').appendChild(el);setTimeout(()=>el.remove(),900);
}
function save(){
 const url=p.get('url')||'';
 if(!url){$('status').textContent='رابط الصفحة غير صالح';return}
 const target=new URL('/guest/save.html',location.origin);
 target.searchParams.set('url',url);
 target.searchParams.set('title',p.get('title')||'');
 const popup=window.open(target.href,'aqxFavoritesSave','popup=yes,width=420,height=280,resizable=yes,scrollbars=no');
 const status=$('status');
 status.replaceChildren();
 if(!popup){
  status.textContent='المتصفح حظر النافذة المنبثقة. ';
  const link=document.createElement('a');
  link.href=target.href;link.target='_blank';link.rel='noopener';
  link.textContent='افتح صفحة الحفظ مباشرة';
  link.style.cssText='color:#6d4bd1;font-weight:800;text-decoration:underline';
  status.appendChild(link);
  return;
 }
 status.textContent='تم فتح نافذة AQX لإتمام الحفظ…';
}
function safeText(s){return String(s||'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}
let integrityObservers=[],renderingRecent=false,integrityArmed=false,integrityCheck=()=>{};
function mountAd(box){
 const existing=box.querySelector('#ad-block');
 if(existing)return existing;
 const wrap=document.createElement('div');
 wrap.id='ad-block';
 wrap.style.cssText='display:flex;justify-content:center;align-items:center;width:300px;height:250px;max-width:100%;margin:10px auto;padding:0;border-bottom:1px solid #f0edf5;overflow:hidden;';
 const inner=document.createElement('div');
 inner.id='aqx-ad-inner';
 inner.style.cssText='width:100%;height:100%;min-width:0;overflow:hidden;';
 wrap.appendChild(inner);
 box.appendChild(wrap);
 const script=document.createElement('script');
 script.async=true;
 script.src='https://vuszqzgldbsscuxdfhdz.supabase.co/functions/v1/aqx-house-ad-serving/client.js';
 script.setAttribute('data-placement-key','aqx_general_ad_slot_320x250');
 script.setAttribute('data-target','#aqx-ad-inner');
 inner.appendChild(script);
 const brandNode=$('aqxBrand');
 const head=brandNode&&brandNode.parentElement;
 const verify=()=>{
  if(renderingRecent||!integrityArmed)return;
  const currentBrand=$('aqxBrand');
  const brandPresent=!!currentBrand&&!!currentBrand.querySelector('a.brand-link');
  const adPresent=!!$('ad-block')&&!!$('aqx-ad-inner');
  // Presence only: no checks of the icon, styles, attributes, layout, or ad contents.
  if(!brandPresent||!adPresent)signalViolation();
 };
 const observe=(target)=>{
  if(!target)return;
  const observer=new MutationObserver(verify);
  observer.observe(target,{childList:true});
  integrityObservers.push(observer);
 };
 // Observe only direct child changes around the AQX ad and brand nodes.
 observe(box);
 observe(head);
 observe(brandNode);
 integrityArmed=true;
 integrityCheck=verify;
 return wrap;
}
async function loadRecent(){
 renderingRecent=true;
 const box=$('items');box.replaceChildren();
 const earlyAd=mountAd(box);
 const loading=document.createElement('div');loading.className='msg';loading.textContent='جارٍ تحميل المحفوظات…';box.appendChild(loading);
 try{
  const token=await unlock();
  const r=await api('/items?limit=4&offset=0&sort=recent',token);
  const latest=(r.items||[]).slice(0,4);
  box.replaceChildren();
  if(!latest.length){
   const empty=document.createElement('div');empty.className='empty';empty.textContent='لا توجد محفوظات حتى الآن.';box.appendChild(empty);
   box.appendChild(earlyAd);renderingRecent=false;integrityCheck();return;
  }
  latest.forEach((x,index)=>{
   const card=document.createElement('div');card.className='item';
   const thumb=document.createElement('img');thumb.className='thumb';thumb.alt='';thumb.referrerPolicy='no-referrer';thumb.loading='lazy';
   let imageUrl='';
   try{imageUrl=x.metadata?.og_image||x.metadata?.image||x.metadata?.thumbnail||new URL('/favicon.ico',new URL(x.url).origin).href}catch{}
   if(imageUrl)thumb.src=imageUrl;
   thumb.onerror=()=>{thumb.removeAttribute('src');thumb.classList.add('fallback');thumb.alt='♡'};
   const body=document.createElement('div');body.className='item-body';
   const b=document.createElement('b');b.textContent=x.title||x.url;
   const sm=document.createElement('small');sm.textContent=x.url;
   const read=document.createElement('a');read.className='read';read.href=x.url;read.target='_blank';read.rel='noopener noreferrer';read.textContent='أكمل القراءة ←';
   body.append(b,sm,read);card.append(thumb,body);box.appendChild(card);
   if(index===1)box.appendChild(earlyAd);
  });
  if(!earlyAd.isConnected)box.appendChild(earlyAd);
  renderingRecent=false;integrityCheck();
 }catch(e){
  box.replaceChildren();const msg=document.createElement('div');msg.className='msg';msg.textContent=e.message||'تعذر تحميل المحفوظات';
  const link=document.createElement('a');link.href='https://favorites.alqurmanix.com/guest/index.html';link.textContent='فتح مكتبتي أو إنشاء مكتبة جديدة';link.style.cssText='display:block;margin:10px auto;color:#6d4bd1;font-weight:800;text-decoration:underline;text-align:center';
  box.append(msg,link,earlyAd);renderingRecent=false;integrityCheck();
 }
}
if(mode==='save'){
 $('saveWrap').hidden=false;
 const u=p.get('url')||'';
 try{new URL(u)}catch{$('save').disabled=true;$('status').textContent='رابط الصفحة غير صالح'}
 $('save').addEventListener('click',save);
}else if(mode==='recent'){
 $('recentWrap').hidden=false;
 const signalViolation=()=>{if(window.parent!==window)window.parent.postMessage({type:'aqx-favorites-tamper'},'*')};
 // Protect the AQX brand from startup; the floating icon is deliberately not monitored.
 const initialBrand=$('aqxBrand');
 const initialBrandAnchor=initialBrand&&initialBrand.querySelector('a.brand-link');
 const initialBrandHead=initialBrand&&initialBrand.parentElement;
 const checkBrand=()=>{
  if(!initialBrand||!initialBrand.isConnected||!initialBrand.querySelector('a.brand-link'))
   signalViolation();
 };
 const brandObserver=new MutationObserver(checkBrand);
 if(initialBrandHead)brandObserver.observe(initialBrandHead,{childList:true});
 if(initialBrand)brandObserver.observe(initialBrand,{childList:true});
 checkBrand();
 const openRecent=()=>{
  $('panel').classList.add('open');$('recentBackdrop').classList.add('open');
  resize(true);
  loadRecent();
 };
 const closeRecent=()=>{
  $('panel').classList.remove('open');$('recentBackdrop').classList.remove('open');
  resize(false);
 };
 $('float').addEventListener('click',openRecent);
 window.addEventListener('message',event=>{if(event.source===parent&&event.data?.type==='aqx-favorites-parent-open')openRecent()});
 $('closePanel').addEventListener('click',closeRecent);
 $('recentBackdrop').addEventListener('click',closeRecent);
 window.addEventListener('keydown',e=>{if(e.key==='Escape')closeRecent()});

}else{document.body.textContent='Invalid embed mode'}
})();
</script>
</body></html>
